<section class="card">
  <h2>Car Fleet</h2>
  <p *ngIf="loading">Loading...</p>
  <p class="message" *ngIf="message">{{ message }}</p>
  <table class="table" *ngIf="cars.length">
    <thead>
    <tr>
      <th>ID</th>
      <th>Brand</th>
      <th>Model</th>
      <th>Year</th>
      <th>Color</th>
      <th>Status</th>
      <th>Km</th>
      <th>Price/day</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let car of cars">
      <td>{{ car.id }}</td>
      <td>{{ car.brand }}</td>
      <td>{{ car.model }}</td>
      <td>{{ car.year }}</td>
      <td>{{ car.color }}</td>
      <td>{{ car.status }}</td>
      <td>{{ car.mileage | number }}</td>
      <td>{{ car.amount | currency:'EUR' }}</td>
    </tr>
    </tbody>
  </table>
</section>

<section class="card">
  <h3>Add a car</h3>
  <form [formGroup]="carForm" (ngSubmit)="submitCar()">
    <label>Brand<input formControlName="brand"></label>
    <label>Model<input formControlName="model"></label>
    <label>Body type<input formControlName="bodyType"></label>
    <label>Year<input type="number" formControlName="year"></label>
    <label>Color<input formControlName="color"></label>
    <label>Mileage<input type="number" formControlName="mileage"></label>
    <label>Price/day<input type="number" formControlName="amount"></label>
    <label>Image (URL)<input formControlName="imageUrl"></label>
    <label>Branch<input type="number" formControlName="branchId"></label>
    <button class="primary" type="submit">Save</button>
  </form>
</section>

<section class="card">
  <h3>Update mileage</h3>
  <form [formGroup]="mileageForm" (ngSubmit)="submitMileage()">
    <label>Car ID<input type="number" formControlName="carId"></label>
    <label>New mileage<input type="number" formControlName="mileage"></label>
    <button class="secondary" type="submit">Update</button>
  </form>
</section>

<section class="card">
  <h3>Change status</h3>
  <form [formGroup]="statusForm" (ngSubmit)="submitStatus()">
    <label>Car ID<input type="number" formControlName="carId"></label>
    <label>Status
      <select formControlName="status">
        <option *ngFor="let status of carStatuses" [value]="status">{{ status }}</option>
      </select>
    </label>
    <button class="secondary" type="submit">Update</button>
  </form>
</section>
